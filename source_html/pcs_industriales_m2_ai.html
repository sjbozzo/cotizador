    const tbody = document.getElementById("productsBody");

    products.forEach((product, index) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${product.nombre_producto}</td>
        <td><img src="${product.foto}" alt="${product.nombre_producto}" loading="lazy" referrerpolicy="no-referrer"></td>
        <td class="price">${product.precio_promedio}</td>
        <td>${product.pais_origen}</td>
        <td><a href="${product.link_compra}" target="_blank" rel="noopener noreferrer">Comprar</a></td>
        <td>${product.descripcion}</td>
        <td>${product.comentario}</td>
        <td class="yes">${product.espacio_m2}</td>
        <td class="check"><input type="checkbox" class="product-check" data-index="${index}" aria-label="Seleccionar ${product.nombre_producto}"></td>
      `;
      tbody.appendChild(row);
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const selected = [...document.querySelectorAll(".product-check:checked")]
        .map(cb => products[Number(cb.dataset.index)]);

      const blob = new Blob([JSON.stringify(selected, null, 2)], {
        type: "application/json;charset=utf-8"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "pcs_industriales_seleccionados.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });
