    const boardRows = document.getElementById("boardRows");
    const acceleratorRows = document.getElementById("acceleratorRows");
    const exportButton = document.getElementById("exportButton");
    const selectedIds = new Set();
    const m2AcceleratorIds = new Set([
      "deepx-dx-m1",
      "hailo-8-m2",
      "axelera-embedded-110m",
      "memryx-mx3",
      "edgecortix-sakura-ii",
      "geniatech-aim-m2",
      "aaeon-up-ai-core-xm2280"
    ]);

    function addCell(row, text, className) {
      const cell = document.createElement("td");
      cell.textContent = text;
      if (className) cell.className = className;
      row.appendChild(cell);
      return cell;
    }

    products.forEach(function (product) {
      const row = document.createElement("tr");
      addCell(row, product.name, "name");

      const photoCell = document.createElement("td");
      photoCell.className = "photo-cell";
      const image = document.createElement("img");
      image.className = "photo";
      image.src = product.imageUrl;
      image.alt = product.name;
      image.loading = "lazy";
      image.referrerPolicy = "no-referrer";
      const fallback = document.createElement("span");
      fallback.className = "photo-fallback";
      fallback.textContent = "Sin foto";
      image.addEventListener("error", function () {
        image.style.display = "none";
        fallback.style.display = "grid";
      });
      photoCell.append(image, fallback);
      row.appendChild(photoCell);

      addCell(row, product.averagePrice, "price");
      addCell(row, product.originCountry, "country");

      const linkCell = document.createElement("td");
      const link = document.createElement("a");
      link.href = product.purchaseUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Comprar";
      linkCell.appendChild(link);
      row.appendChild(linkCell);

      addCell(row, product.description, "description");
      addCell(row, product.comment, "comment");
      addCell(row, product.supportsM2 ? "Sí" : "No", "m2");

      const selectCell = document.createElement("td");
      selectCell.className = "select";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.setAttribute("aria-label", "Seleccionar " + product.name);
      checkbox.addEventListener("change", function () {
        if (checkbox.checked) selectedIds.add(product.id);
        else selectedIds.delete(product.id);
        exportButton.disabled = selectedIds.size === 0;
        exportButton.textContent = "Exportar JSON (" + selectedIds.size + ")";
      });
      selectCell.appendChild(checkbox);
      row.appendChild(selectCell);
      const destination = m2AcceleratorIds.has(product.id) ? acceleratorRows : boardRows;
      destination.appendChild(row);
    });

    exportButton.addEventListener("click", function () {
      const selectedProducts = products
        .filter(function (product) { return selectedIds.has(product.id); })
        .map(function (product) {
          return {
            id: product.id,
            nombre: product.name,
            foto: product.imageUrl,
            precioPromedio: product.averagePrice,
            paisDeOrigen: product.originCountry,
            linkDeCompra: product.purchaseUrl,
            descripcion: product.description,
            comentario: product.comment,
            tipo: m2AcceleratorIds.has(product.id) ? "Acelerador M.2" : "Placa o equipo",
            espacioParaM2: product.supportsM2
          };
        });

      const exportData = {
        fechaDeExportacion: new Date().toISOString(),
        cantidad: selectedProducts.length,
        productos: selectedProducts
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const download = document.createElement("a");
      download.href = url;
      download.download = "dispositivos-edge-ai-seleccion-" + new Date().toISOString().slice(0, 10) + ".json";
      document.body.appendChild(download);
      download.click();
      download.remove();
      URL.revokeObjectURL(url);
    });
  </script>
